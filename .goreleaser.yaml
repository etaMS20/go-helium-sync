version: 2

builds:
  - main: ./cmd/hesync
    binary: hesync
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]

nfpms:
  - package_name: hesync
    homepage: https://github.com/etams20/go-helium-sync
    maintainer: etams20 <m.schaedle@proton.me>
    description: Sync Helium browser bookmarks between Linux machines via git.
    license: MIT
    formats: [deb, rpm]
    dependencies: [git]

checksum:
  name_template: checksums.txt
